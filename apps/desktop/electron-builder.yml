appId: com.project.desktop
productName: Linux Agent
executableName: linux-agent
directories:
  output: dist
files:
  - out/**
  - package.json
asar: true
# Security checklist #19 (audit LH-116): flip the dangerous Electron fuses in
# packaged builds. The Playwright e2e runs the UNPACKED out/ bundle, so
# nodeCliInspect=off here does not break electron.launch() in tests.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
linux:
  target:
    - AppImage
    - pacman
  category: System
  maintainer: moonrock-software
npmRebuild: false
electronVersion: 42.4.0
artifactName: linux-agent-${version}.${ext}
